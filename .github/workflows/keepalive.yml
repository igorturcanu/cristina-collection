name: Supabase keep-alive
# Supabase free projects pause after a week without activity. This pings the database twice a week.
on:
  schedule:
    - cron: "17 6 * * 1,4"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS "https://mngjveyvtehsxmftnjei.supabase.co/rest/v1/products?select=id&limit=1" \
            -H "apikey: sb_publishable_HbE5pxHANOGtpzNDRi_Yjw_VS5NnZER" > /dev/null && echo ok
